name: "Build Image"
description: "Build Image, and optionally push to an ECR Repository"

inputs:
  repository_name:
    description: 'The name of the ECR repository to upload image to'
    required: true
  image_name:
    description: 'The name of the image being uploaded to the ECR repository'
    required: true
  registry_name:
    description: 'The name of the ECR registry for the environment'
    required: true
  docker_file:
    description: 'The path to the dockerfile'
    required: true
  image_property_name:
    required: true
    description: 'The name of the corresponding image property in the infrastructure'
  github_token:
    required: true
    description: 'The admin github token'
  image_architecture:
    required: false
    default: 'linux/amd64'
    description: 'The architectures for which to build the images'
  build_options:
    required: false
    description: "Additional options for the docker build"
  set_image_property:
    required: false
    default: 'true'
    description: "Whether to update the corresponding image tag in pending-man/pending-hotfix image.properties"
  push_to_ECR:
    required: false
    description: 'If false, will only build image and not push it'
    default: 'true'
  cache_from:
    required: false
    default: ''
    description: 'Cache source for docker buildx (e.g. type=gha,scope=my-repo or type=registry,ref=my-registry/my-image:cache)'
  cache_to:
    required: false
    default: ''
    description: 'Cache destination for docker buildx (e.g. type=gha,scope=my-repo,mode=max or type=registry,ref=my-registry/my-image:cache,mode=max)'
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Identity - Build, tag, and push image to Amazon ECR
      id: build-image
      shell: bash
      env:
        ECR_REGISTRY: ${{ inputs.registry_name }}
        DOCKER_FILE: ${{ inputs.docker_file }}
      run: |
        IMAGE_NAME=$ECR_REGISTRY/${{inputs.repository_name}}:${{inputs.image_name}}

        CACHE_ARGS=""
        if [ -n "${{ inputs.cache_from }}" ]; then
          CACHE_ARGS="$CACHE_ARGS --cache-from ${{ inputs.cache_from }}"
        fi
        if [ -n "${{ inputs.cache_to }}" ]; then
          CACHE_ARGS="$CACHE_ARGS --cache-to ${{ inputs.cache_to }}"
        fi

        docker buildx build -f $DOCKER_FILE -t $IMAGE_NAME --platform=${{inputs.image_architecture}} --load ${{inputs.build_options}} $CACHE_ARGS .
        if [ "${{ inputs.push_to_ECR }}" = "true" ]; then
          docker push $IMAGE_NAME
        fi
        echo "::set-output name=image::$IMAGE_NAME"

    - name: Get other actions
      if: ${{ success() && ( inputs.set_image_property == 'true' ) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hotfix' || github.ref == 'refs/heads/release-candidate') }}
      uses: actions/checkout@v2
      with:
        repository: wildsparq/.github
        token: ${{ inputs.github_token }}
        path: .github

    - uses: ./.github/workflows/composite/set-infrastructure-image-property
      if: ${{ success() && ( inputs.set_image_property == 'true' ) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hotfix' || github.ref == 'refs/heads/release-candidate') }}
      with:
        image_property_name: ${{inputs.image_property_name}}
        github_token: ${{inputs.github_token}}
        image_name: ${{inputs.image_name}}
